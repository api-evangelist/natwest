actions:
  apisYmlUpdated: true
  openapiHarvested:
    - openapi/natwest-account-transaction-openapi.yml
    - openapi/natwest-payment-initiation-openapi.yml
    - openapi/natwest-confirmation-of-funds-openapi.yml
  reason: |
    NatWest exposes a real, sandbox-backed, FAPI/PSD2-conformant Open Banking
    API surface. Three OBIE v3.1.11 OpenAPI specs were harvested verbatim with
    provenance noted. Auth model was verified live against the sandbox OIDC
    discovery endpoint. No public plans/pricing exist (regulated free access),
    so pricing derivation is left to the enrichment pipeline.
