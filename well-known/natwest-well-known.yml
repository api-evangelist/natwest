notes: |
  The sandbox OpenID Connect discovery document (api.sandbox.natwest.com) is the
  authoritative FAPI/PSD2 auth surface: OAuth2/OIDC hybrid (response_type
  "code id_token"), grant types authorization_code/refresh_token/client_credentials,
  token-endpoint auth tls_client_auth + private_key_jwt (PS256), dynamic client
  registration, ACR urn:openbanking:psd2:ca, tls_client_certificate_bound_access_tokens.
  The production api.natwest.com discovery endpoint requires a brand/context path
  and returns 400 to a bare request. security.txt is published at the NatWest Group
  root (www.natwest.com) and points to the NatWest Group Bugcrowd VDP.
