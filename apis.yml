    conformant to the OBIE Read/Write Standard v3.1.11, letting authorised providers
    establish a funds-confirmation consent and check whether sufficient funds are
    available on a customer account under the "fundsconfirmations" OAuth scope,
    secured with FAPI OAuth2/OIDC, PSD2 SCA, and mutual-TLS.
