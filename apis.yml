aid: natwest
url: https://raw.githubusercontent.com/api-evangelist/natwest/refs/heads/main/apis.yml
name: NatWest Group
kind: company
description: NatWest Group is a major UK retail and commercial bank (formerly Royal
  Bank of Scotland Group) serving personal, business, and corporate customers across
  the NatWest, Royal Bank of Scotland, Ulster Bank, Coutts, and NatWest International
  brands. It operates a public developer platform branded the "Bank of APIs" that
  publishes UK Open Banking (CMA9 / PSD2) APIs - Account and Transaction Information,
  Payment Initiation, and Confirmation of Funds - conformant to the Open Banking
  Implementation Entity (OBIE) Read/Write API Standard, alongside premium and
  commercial APIs. Access is secured with FAPI-grade OAuth2/OIDC, PSD2 strong
  customer authentication, mutual-TLS client authentication, and dynamic client
  registration using OBIE/eIDAS certificates, with a full sandbox for onboarding
  and testing before production.
